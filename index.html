<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Ariketa</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="code.js" defer></script>
</head>

<body>
    <!-- Edukiontzi nagusia -->
    <main class="container">
        <!-- Konfigurazio-inprimakia -->
        <form id="setup-form" class="config-form">
            <!-- Saialdi kopururako hautatzailea -->
            <div class="form-group">
                <label for="intentos">Intentos</label>
                <select id="intentos" name="intentos">
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6" selected>6</option> <!-- selected: Lehenetsitako aukera -->
                    <option value="7">7</option>
                </select>
            </div>

            <!-- Hizkera hautzailea -->
            <div class="form-group">
                <label for="letras">nº de letras</label>
                <select id="letras" name="letras">
                    <option value="4">4</option>
                    <option value="5" selected>5</option><!-- selected: Lehenetsitako aukera -->
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
            </div>

            <!-- Hasiera emateko botoia -->
            <button type="submit" id="btn-jugar" class="btn-play">Jugar</button>
        </form>
    </main>
</body>

</html>
